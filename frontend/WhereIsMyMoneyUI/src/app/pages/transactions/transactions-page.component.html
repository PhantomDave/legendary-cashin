<app-section-header
  title="Transactions"
  subtitle="A feature page owns its table, filters, and orchestration."
  ctaText="Add Transaction"
  (ctaClicked)="addTransaction()"
/>

<p-table
  [value]="transactions()?.items ?? []"
  [loading]="isLoading()"
  [paginator]="true"
  [lazy]="true"
  [rows]="rows"
  [first]="first"
  [totalRecords]="transactions()?.totalCount ?? 0"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [showCurrentPageReport]="true"
  [currentPageReportTemplate]="'Showing {first} to {last} of {totalRecords} entries'"
  [tableStyle]="{ 'min-width': '50rem' }"
  [size]="'small'"
  [showGridlines]="true"
  (onLazyLoad)="onLazyLoad($event)"
>
  <ng-template pTemplate="header">
    <tr>
      <th>
        Date
        <p-columnFilter
          field="date"
          display="menu"
          matchMode="equals"
          [showOperator]="false"
          [showAddButton]="false"
          [showMatchModes]="false"
          [showApplyButton]="true"
          [showClearButton]="true"
        >
          <ng-template pTemplate="filter" let-value let-filter="filterCallback">
            <p-datepicker
              [ngModel]="value"
              (ngModelChange)="filter($event)"
              appendTo="body"
              dateFormat="dd/mm/yy"
              placeholder="Date"
              size="small"
            />
          </ng-template>
        </p-columnFilter>
      </th>
      <th>
        Budget
        <p-columnFilter
          field="budgetId"
          display="menu"
          matchMode="equals"
          [showOperator]="false"
          [showAddButton]="false"
          [showMatchModes]="false"
          [showApplyButton]="true"
          [showClearButton]="true"
        >
          <ng-template pTemplate="filter" let-value let-filter="filterCallback">
            <p-select
              [ngModel]="value"
              (ngModelChange)="filter($event)"
              [options]="budgets()"
              appendTo="body"
              [showClear]="true"
              optionLabel="name"
              optionValue="id"
              placeholder="All budgets"
              size="small"
              styleClass="table-filter-control"
            />
          </ng-template>
        </p-columnFilter>
      </th>
      <th>
        Categories
        <p-columnFilter
          field="categoryId"
          display="menu"
          matchMode="equals"
          [showOperator]="false"
          [showAddButton]="false"
          [showMatchModes]="false"
          [showApplyButton]="true"
          [showClearButton]="true"
        >
          <ng-template pTemplate="filter" let-value let-filter="filterCallback">
            <p-select
              [ngModel]="value"
              (ngModelChange)="filter($event)"
              [options]="categoryFilterOptions()"
              appendTo="body"
              [showClear]="true"
              optionLabel="label"
              optionValue="value"
              placeholder="All categories"
              size="small"
              styleClass="table-filter-control"
            />
          </ng-template>
        </p-columnFilter>
      </th>
      <th>
        Description
        <p-columnFilter
          field="description"
          display="menu"
          matchMode="contains"
          [showOperator]="false"
          [showAddButton]="false"
          [showMatchModes]="false"
          [showApplyButton]="true"
          [showClearButton]="true"
        >
          <ng-template pTemplate="filter" let-value let-filter="filterCallback">
            <input
              pInputText
              [ngModel]="value"
              (ngModelChange)="filter($event)"
              placeholder="Search description"
              class="table-filter-control"
            />
          </ng-template>
        </p-columnFilter>
      </th>
      <th>
        Amount
        <p-columnFilter
          field="amount"
          display="menu"
          matchMode="equals"
          [showOperator]="false"
          [showAddButton]="false"
          [showMatchModes]="true"
          [showApplyButton]="true"
          [showClearButton]="true"
          [matchModeOptions]="amountMatchModes"
        >
          <ng-template pTemplate="filter" let-value let-filter="filterCallback">
            <p-inputnumber
              [ngModel]="value"
              (ngModelChange)="filter($event)"
              [maxFractionDigits]="2"
              [minFractionDigits]="2"
              mode="decimal"
              placeholder="Amount"
              inputStyleClass="table-filter-control"
            />
          </ng-template>
        </p-columnFilter>
      </th>
      <th>Actions</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-item>
    <tr>
      <td>
        <p-inplace
          #dateInplace
          (onActivate)="startEdit(item)"
          (onDeactivate)="cancelEdit(item.id)"
          [closable]="false"
        >
          <ng-template #display>{{ item.date | date: 'dd/MM/yyyy HH:mm' }}</ng-template>
          <ng-template #content>
            <div class="inline-edit-cell">
              <p-datepicker
                [(ngModel)]="getEditingValue(item.id).date"
                [appendTo]="'body'"
                dateFormat="dd/mm/yy"
                hourFormat="24"
                [showTime]="true"
                ariaLabel="Transaction date"
                size="small"
              />
              <p-button
                (onClick)="saveEdit(item, dateInplace)"
                [loading]="isLoading()"
                aria-label="Save transaction date"
                icon="pi pi-check"
                severity="success"
                size="small"
              />
              <p-button
                (onClick)="dateInplace.deactivate()"
                aria-label="Cancel editing transaction date"
                icon="pi pi-times"
                severity="secondary"
                size="small"
              />
            </div>
          </ng-template>
        </p-inplace>
      </td>
      <td>
        <p-inplace
          #budgetInplace
          (onActivate)="startEdit(item)"
          (onDeactivate)="cancelEdit(item.id)"
          [closable]="false"
        >
          <ng-template #display>
            <span
              class="table-truncate table-truncate--budget"
              [pTooltip]="resolveBudgetName(item.budgetId)"
              tooltipPosition="top"
            >
              {{ resolveBudgetName(item.budgetId) }}
            </span>
          </ng-template>
          <ng-template #content>
            <div class="inline-edit-cell">
              <p-select
                [(ngModel)]="getEditingValue(item.id).budgetId"
                [options]="budgets()"
                appendTo="body"
                ariaLabel="Transaction budget"
                optionLabel="name"
                optionValue="id"
                placeholder="Select budget"
                size="small"
              />
              <p-button
                (onClick)="saveEdit(item, budgetInplace)"
                [loading]="isLoading()"
                aria-label="Save transaction budget"
                icon="pi pi-check"
                severity="success"
                size="small"
              />
              <p-button
                (onClick)="budgetInplace.deactivate()"
                aria-label="Cancel editing transaction budget"
                icon="pi pi-times"
                severity="secondary"
                size="small"
              />
            </div>
          </ng-template>
        </p-inplace>
      </td>
      <td>
        <p-inplace
          #categoriesInplace
          (onActivate)="startEdit(item)"
          (onDeactivate)="cancelEdit(item.id)"
          [closable]="false"
        >
          <ng-template #display>
            <span
              class="table-truncate table-truncate--categories"
              [pTooltip]="resolveCategoryNames(item.categoryIds)"
              tooltipPosition="top"
            >
              {{ resolveCategoryNames(item.categoryIds) }}
            </span>
          </ng-template>
          <ng-template #content>
            <div class="inline-edit-cell">
              <p-multiselect
                [(ngModel)]="getEditingValue(item.id).categoryIds"
                [options]="categoryOptions()"
                ariaLabel="Transaction categories"
                appendTo="body"
                optionLabel="label"
                optionValue="value"
                placeholder="Select categories"
                size="small"
              />
              <p-button
                (onClick)="saveEdit(item, categoriesInplace)"
                [loading]="isLoading()"
                aria-label="Save transaction categories"
                icon="pi pi-check"
                severity="success"
                size="small"
              />
              <p-button
                (onClick)="categoriesInplace.deactivate()"
                aria-label="Cancel editing transaction categories"
                icon="pi pi-times"
                severity="secondary"
                size="small"
              />
            </div>
          </ng-template>
        </p-inplace>
      </td>
      <td>
        <p-inplace
          #descriptionInplace
          (onActivate)="startEdit(item)"
          (onDeactivate)="cancelEdit(item.id)"
          [closable]="false"
        >
          <ng-template #display>
            <span
              class="table-truncate table-truncate--description"
              [pTooltip]="item.description"
              tooltipPosition="top"
            >
              {{ item.description }}
            </span>
          </ng-template>
          <ng-template #content>
            <div class="inline-edit-cell">
              <input
                [(ngModel)]="getEditingValue(item.id).description"
                aria-label="Transaction description"
                pInputText
                size="small"
              />
              <p-button
                (onClick)="saveEdit(item, descriptionInplace)"
                [loading]="isLoading()"
                aria-label="Save transaction description"
                icon="pi pi-check"
                severity="success"
                size="small"
              />
              <p-button
                (onClick)="descriptionInplace.deactivate()"
                aria-label="Cancel editing transaction description"
                icon="pi pi-times"
                severity="secondary"
                size="small"
              />
            </div>
          </ng-template>
        </p-inplace>
      </td>
      <td>
        <p-inplace
          #amountInplace
          (onActivate)="startEdit(item)"
          (onDeactivate)="cancelEdit(item.id)"
          [closable]="false"
        >
          <ng-template #display>{{
            item.amount | currency: selectedBudget()?.defaultCurrency
          }}</ng-template>
          <ng-template #content>
            <div class="inline-edit-cell">
              <p-inputnumber
                [(ngModel)]="getEditingValue(item.id).amount"
                [maxFractionDigits]="2"
                [minFractionDigits]="2"
                ariaLabel="Transaction amount"
                mode="decimal"
              />
              <p-button
                (onClick)="saveEdit(item, amountInplace)"
                [loading]="isLoading()"
                aria-label="Save transaction amount"
                icon="pi pi-check"
                severity="success"
                size="small"
              />
              <p-button
                (onClick)="amountInplace.deactivate()"
                aria-label="Cancel editing transaction amount"
                icon="pi pi-times"
                severity="secondary"
                size="small"
              />
            </div>
          </ng-template>
        </p-inplace>
      </td>
      <td>
        <p-button
          (onClick)="deleteTransaction($event, item.id)"
          icon="pi pi-trash"
          severity="danger"
          size="small"
        />
      </td>
    </tr>
  </ng-template>
</p-table>

<p-confirmDialog></p-confirmDialog>

<app-create-transaction-component
  [(visible)]="isCreateTransactionDialogVisible"
  (transactionCreated)="onTransactionCreated()"
/>
